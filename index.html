<!DOCTYPE html>
<html lang="be" data-theme="light" data-color="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>КТП · Матэматыка · Багданаўская СШ</title>

<!-- KaTeX для формул -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

<style>
/* =========================================================
   ЗМЕННЫЯ
   ========================================================= */
:root{
  --bg:#f4f5fa; --bg-deep:#eceefa;
  --card:#ffffff; --card-2:#fafbff;
  --text:#0f172a; --text-2:#475569; --muted:#94a3b8;
  --border:#e5e9f2; --border-2:#eef1f8; --hover:#f8faff;
  --danger:#e5484d;
  --today:#10b981; --today-soft:#ecfdf5;
  --next:#f59e0b;  --next-soft:#fffbeb;
  --past:#94a3b8;  --past-soft:#f1f5f9;
  --edit:#f59e0b;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 14px -4px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg:0 24px 48px -16px rgba(15,23,42,.16);
  --radius:18px;
}
html[data-color="indigo"]{ --accent:#6366f1; --accent-2:#8b5cf6; --accent-text:#4f46e5; --accent-soft:#eef0ff; }
html[data-color="ocean"] { --accent:#0ea5e9; --accent-2:#06b6d4; --accent-text:#0284c7; --accent-soft:#e0f2fe; }
html[data-color="violet"]{ --accent:#8b5cf6; --accent-2:#a855f7; --accent-text:#7c3aed; --accent-soft:#f3e8ff; }
html[data-color="rose"]  { --accent:#f43f5e; --accent-2:#ec4899; --accent-text:#e11d48; --accent-soft:#ffe4e6; }
html[data-color="amber"] { --accent:#f59e0b; --accent-2:#f97316; --accent-text:#d97706; --accent-soft:#fef3c7; }
html[data-color="teal"]  { --accent:#14b8a6; --accent-2:#06b6d4; --accent-text:#0d9488; --accent-soft:#ccfbf1; }
html[data-color="slate"] { --accent:#64748b; --accent-2:#475569; --accent-text:#475569; --accent-soft:#f1f5f9; }

html[data-theme="dark"]{
  --bg:#0c0f16; --bg-deep:#070a10;
  --card:#151a24; --card-2:#1a1f2b;
  --text:#e8ecf4; --text-2:#a8b3c4; --muted:#6b7689;
  --border:#242b38; --border-2:#1c222d; --hover:#1a1f2b;
  --danger:#ff6b6f;
  --today:#34d399; --today-soft:#0d2620;
  --next:#fbbf24;  --next-soft:#2a2110;
  --past:#64748b;  --past-soft:#141926;
  --edit:#fbbf24;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 14px -4px rgba(0,0,0,.5);
  --shadow-lg:0 24px 48px -16px rgba(0,0,0,.7);
}
html[data-theme="dark"][data-color="indigo"]{ --accent:#818cf8; --accent-2:#a78bfa; --accent-text:#a5b4fc; --accent-soft:#1e2440; }
html[data-theme="dark"][data-color="ocean"] { --accent:#38bdf8; --accent-2:#22d3ee; --accent-text:#7dd3fc; --accent-soft:#0c2c3f; }
html[data-theme="dark"][data-color="violet"]{ --accent:#a78bfa; --accent-2:#c084fc; --accent-text:#c4b5fd; --accent-soft:#2a1e40; }
html[data-theme="dark"][data-color="rose"]  { --accent:#fb7185; --accent-2:#f472b6; --accent-text:#fda4af; --accent-soft:#3a1a25; }
html[data-theme="dark"][data-color="amber"] { --accent:#fbbf24; --accent-2:#fb923c; --accent-text:#fcd34d; --accent-soft:#2a2110; }
html[data-theme="dark"][data-color="teal"]  { --accent:#2dd4bf; --accent-2:#22d3ee; --accent-text:#5eead4; --accent-soft:#0d2a26; }
html[data-theme="dark"][data-color="slate"] { --accent:#94a3b8; --accent-2:#64748b; --accent-text:#cbd5e1; --accent-soft:#1c222d; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter","Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:
    radial-gradient(1400px 700px at 15% -20%, var(--accent-soft), transparent 55%),
    radial-gradient(1000px 500px at 100% 0%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 50%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  font-size:15px; line-height:1.5;
  transition:background-color .3s ease,color .3s ease;
}
.app{max-width:1280px;margin:0 auto;padding:0 20px 80px;}

/* =========================================================
   ШАПКА — sticky
   ========================================================= */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
  padding:14px 0;margin-bottom:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 94%, transparent) 0%,
    color-mix(in srgb, var(--bg) 85%, transparent) 75%,
    transparent 100%);
  transition:padding .25s ease,margin .25s ease;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0;}
.logo{
  width:52px;height:52px;flex:none;border-radius:15px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
  color:#fff;display:grid;place-items:center;
  font-size:26px;font-weight:800;font-family:"Times New Roman",serif;
  box-shadow:0 10px 26px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.25);
  letter-spacing:-1px;
  transition:all .25s ease;
}
.brand h1{
  margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15;
  background:linear-gradient(135deg,var(--text) 20%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  transition:font-size .25s ease;
}
html[data-theme="dark"] .brand h1{
  background:linear-gradient(135deg,#fff 20%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500;transition:all .25s ease;}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;transition:gap .25s ease;}

button{
  font:inherit;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:10px 16px;border-radius:12px;cursor:pointer;
  transition:all .18s ease;white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px;
  min-height:42px;box-shadow:var(--shadow-sm);
}
button:hover{background:var(--hover);border-color:var(--accent);color:var(--accent-text);transform:translateY(-1px);box-shadow:var(--shadow);}
button:active{transform:translateY(0);}
button.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.2);
}
button.primary:hover{color:#fff;filter:brightness(1.08);}
button.success{
  background:linear-gradient(135deg,var(--today),#059669);
  border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -8px var(--today), inset 0 1px 0 rgba(255,255,255,.2);
}
button.success:hover{color:#fff;filter:brightness(1.08);}
button.warn{
  background:linear-gradient(135deg,var(--next),#d97706);
  border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -8px var(--next), inset 0 1px 0 rgba(255,255,255,.2);
}
button.warn:hover{color:#fff;filter:brightness(1.08);}
button.ghost{background:transparent;box-shadow:none;}
button.ghost:hover{background:var(--card);}
button.icon{padding:10px 12px;font-size:16px;line-height:1;min-width:42px;justify-content:center;}

/* кампактная шапка (пры скролі на мабільным) */
.topbar.compact{padding:8px 0;margin-bottom:8px;}
.topbar.compact .logo{width:36px;height:36px;font-size:18px;border-radius:10px;}
.topbar.compact .brand{gap:9px;}
.topbar.compact .brand h1{font-size:15px;}
.topbar.compact .brand p{display:none;}
.topbar.compact button{
  padding:7px 10px;min-height:34px;font-size:12.5px;gap:6px;
  border-radius:9px;
}
.topbar.compact button.icon{min-width:34px;padding:7px 8px;font-size:14px;}
.topbar.compact .actions{gap:6px;}

/* =========================================================
   ПАНЕЛЬ ТЭМ
   ========================================================= */
.theme-panel{
  position:absolute;top:calc(100% + 10px);right:0;z-index:60;
  width:290px;background:var(--card);
  border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(-8px) scale(.97);
  pointer-events:none;
  transition:all .2s cubic-bezier(.2,.8,.2,1);
  transform-origin:top right;
}
.theme-panel.show{opacity:1;transform:none;pointer-events:auto;}
.theme-section{margin-bottom:16px;}
.theme-section:last-child{margin-bottom:0;}
.theme-label{
  font-size:10.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px;
}
.mode-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mode-btns button{
  padding:9px 8px;font-size:11.5px;font-weight:600;
  border-radius:10px;justify-content:center;min-height:auto;box-shadow:none;
}
.mode-btns button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 14px -6px var(--accent);
}
.mode-btns button.active:hover{color:#fff;}
.color-swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.swatch{
  width:100%;aspect-ratio:1;border-radius:50%;
  border:2px solid transparent;
  padding:0;min-height:0;box-shadow:none;
  background:var(--sw);cursor:pointer;position:relative;
  transition:all .18s ease;
}
.swatch:hover{transform:scale(1.12);box-shadow:0 4px 12px -3px var(--sw);}
.swatch.active{border-color:var(--card);box-shadow:0 0 0 2px var(--sw), 0 4px 12px -3px var(--sw);}
.swatch.active::after{
  content:"✓";position:absolute;inset:0;
  display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:800;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* =========================================================
   ПАНЕЛЬ РЭДАГАВАННЯ
   ========================================================= */
.editbar{
  display:none;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;margin-bottom:16px;
  border-radius:16px;
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--edit) 12%, var(--card)),
    color-mix(in srgb, var(--edit) 6%, var(--card)));
  border:1.5px solid color-mix(in srgb, var(--edit) 40%, transparent);
  box-shadow:0 8px 24px -10px color-mix(in srgb, var(--edit) 50%, transparent);
  animation:slideDown .3s cubic-bezier(.2,.8,.2,1);
}
.editbar.show{display:flex;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
.editbar-icon{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:var(--edit);color:#fff;
  display:grid;place-items:center;font-size:17px;
  box-shadow:0 4px 12px -4px var(--edit);
}
.editbar-text{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.4;}
.editbar-text b{color:var(--edit);}
.editbar-text small{display:block;font-weight:500;font-size:11.5px;color:var(--text-2);margin-top:2px;}
.editbar-text code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:color-mix(in srgb, var(--edit) 18%, transparent);
  color:var(--text);
  padding:1px 5px;border-radius:5px;font-size:11px;font-weight:600;
}
.editbar-spacer{flex:1;min-width:8px;}

/* =========================================================
   ТАБЫ
   ========================================================= */
.tabs{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;
  scrollbar-width:none;margin-bottom:4px;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:none;padding:11px 18px;border-radius:14px;cursor:pointer;
  border:1px solid var(--border);background:var(--card);
  font-size:13.5px;font-weight:600;color:var(--text-2);
  transition:all .2s ease;user-select:none;line-height:1.25;text-align:left;
  box-shadow:var(--shadow-sm);
  min-height:56px;display:flex;flex-direction:column;justify-content:center;
}
.tab small{display:block;font-weight:500;font-size:10.5px;opacity:.7;margin-top:3px;letter-spacing:.2px;}
.tab:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;
  box-shadow:0 10px 24px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.2);
  transform:translateY(-1px);
}
.tab.active small{opacity:.85;color:#fff;}

/* =========================================================
   СУБ-ТАБЫ
   ========================================================= */
.subtabs-wrap{display:none;margin-bottom:14px;animation:subIn .25s ease;}
.subtabs-wrap.show{display:block;}
@keyframes subIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.subtabs-label{
  font-size:10px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--muted);
  margin:0 0 7px 4px;
}
.subtabs{
  display:flex;gap:6px;padding:6px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  width:fit-content;max-width:100%;
  box-shadow:var(--shadow-sm);
  overflow-x:auto;scrollbar-width:none;
}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{
  padding:9px 20px;border-radius:11px;
  font-size:13.5px;font-weight:700;
  color:var(--text-2);cursor:pointer;
  border:none;background:transparent;box-shadow:none;
  transition:all .18s ease;
  display:flex;flex-direction:column;align-items:flex-start;
  min-height:0;flex:none;line-height:1.2;
  text-align:left;
}
.subtab small{font-size:10px;font-weight:500;opacity:.7;margin-top:3px;letter-spacing:.2px;}
.subtab:hover{color:var(--text);background:var(--hover);transform:none;box-shadow:none;}
.subtab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 6px 16px -6px var(--accent);
}
.subtab.active small{opacity:.85;color:#fff;}

/* =========================================================
   КАРТКА
   ========================================================= */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;
  transition:box-shadow .3s ease,border-color .3s ease;
  animation:rise .4s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card.editing{
  border-color:color-mix(in srgb, var(--edit) 45%, transparent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--edit) 15%, transparent), var(--shadow-lg);
}
.cardhead{
  padding:22px 24px 18px;border-bottom:1px solid var(--border-2);
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
}
.cardhead h2{
  margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.cardhead h2::before{
  content:"";width:4px;height:20px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
.comp-chip{
  font-size:10.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;
  padding:4px 10px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent-text);
  border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  margin-left:4px;
}
.cardhead .sub{margin:6px 0 0;font-size:12.5px;color:var(--muted);font-weight:500;}

.nextinfo{
  font-size:13px;padding:11px 16px;border-radius:14px;
  background:var(--accent-soft);color:var(--accent-text);
  font-weight:600;line-height:1.5;max-width:440px;
  display:flex;align-items:center;gap:9px;
  border:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  transition:all .3s ease;
}
.nextinfo::before{
  content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;
  box-shadow:0 0 0 4px color-mix(in srgb, currentColor 20%, transparent);
  animation:pulse 2s ease-in-out infinite;
}
.nextinfo.no-pulse::before{animation:none;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px color-mix(in srgb, currentColor 20%, transparent);}
  50%{box-shadow:0 0 0 7px color-mix(in srgb, currentColor 8%, transparent);}
}

/* =========================================================
   ТАБЛІЦА
   ========================================================= */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:14px;}
thead th{
  text-align:left;font-size:11px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--muted);
  padding:13px 16px;border-bottom:1px solid var(--border);
  background:var(--card-2);position:sticky;top:0;z-index:5;
}
tbody td{
  padding:14px 16px;border-bottom:1px solid var(--border-2);
  vertical-align:top;line-height:1.55;
}
tbody tr{transition:background .18s ease;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.group-start{border-top:2px solid var(--border);}
tbody tr.group-start:first-child{border-top:none;}

.col-n{width:52px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;}
.col-date{width:150px;white-space:nowrap;}
.col-h{width:80px;text-align:center;}
.col-topic{min-width:260px;font-weight:500;}
.col-hw{width:210px;color:var(--text-2);font-size:13px;}
.col-act{width:130px;text-align:right;white-space:nowrap;}

.date-edit{
  font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;
  padding:2px 6px;margin:-2px -6px;border-radius:6px;
  display:inline-block;vertical-align:middle;
}
.date-empty{color:var(--muted);font-weight:500;opacity:.6;font-style:italic;}

/* кнопка календара */
.cal-btn{
  display:inline-grid;place-items:center;
  width:28px;height:28px;
  padding:0;min-height:0;
  margin-left:6px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text-2);
  cursor:pointer;
  font-size:13px;
  vertical-align:middle;
  box-shadow:none;
  transition:all .15s ease;
}
.cal-btn:hover{
  color:var(--accent-text);
  border-color:var(--accent);
  background:var(--accent-soft);
  transform:none;box-shadow:none;
}
.cal-btn:active{transform:scale(.94);}

.badge{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  padding:3px 8px;border-radius:7px;margin-left:7px;vertical-align:1px;
  text-transform:uppercase;
  animation:badgeIn .3s ease;
}
@keyframes badgeIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.badge.today{background:var(--today);color:#fff;box-shadow:0 3px 8px -2px var(--today);}
.badge.next {background:var(--next); color:#fff;box-shadow:0 3px 8px -2px var(--next);}
.badge.past {background:var(--past); color:#fff;box-shadow:0 3px 8px -2px var(--past);}

tr.row-today{background:var(--today-soft)!important;}
tr.row-today td{border-bottom-color:color-mix(in srgb,var(--today) 22%,transparent);}
tr.row-today .col-date{color:var(--today);}
tr.row-today .date-edit{color:var(--today);}
tr.row-today .col-topic{font-weight:700;color:var(--text);}
tr.row-today td:first-child{box-shadow:inset 4px 0 0 var(--today);}

tr.row-next{background:var(--next-soft)!important;}
tr.row-next td{border-bottom-color:color-mix(in srgb,var(--next) 20%,transparent);}
tr.row-next .col-date{color:var(--next);}
tr.row-next .col-topic{color:var(--text);}
tr.row-next td:first-child{box-shadow:inset 4px 0 0 var(--next);}

tr.row-past{background:var(--past-soft)!important;}
tr.row-past td{border-bottom-color:color-mix(in srgb,var(--past) 20%,transparent);}
tr.row-past .col-date{color:var(--past);}
tr.row-past .date-edit{color:var(--past);}
tr.row-past .col-topic{color:var(--text-2);}
tr.row-past .col-hw{color:var(--muted);}
tr.row-past td:first-child{box-shadow:inset 4px 0 0 var(--past);color:var(--past);}
tr.row-past:hover{background:color-mix(in srgb, var(--past) 14%, var(--card))!important;}

.hours-val{

  font-weight:700;font-size:14px;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.hours-input{
  width:52px;text-align:center;
  font:inherit;font-weight:700;font-size:14px;

.hours-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.hours-input:focus{outline:none;border-color:var(--edit);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--edit) 20%,transparent);}

/* рэдагаванне */
.ktp.editing [contenteditable]{
  outline:none;border-radius:7px;padding:3px 7px;margin:-3px -7px;
  transition:background .15s,box-shadow .15s;
  min-height:1.4em;cursor:text;
  background:color-mix(in srgb, var(--edit) 6%, transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--edit) 18%, transparent);
  white-space:pre-wrap;
}
.ktp.editing [contenteditable]:hover{background:color-mix(in srgb, var(--edit) 12%, transparent);}
.ktp.editing [contenteditable]:focus{
  background:color-mix(in srgb, var(--edit) 10%, var(--card));
  box-shadow:0 0 0 2px var(--edit);
}
.ktp.editing [contenteditable]:empty::before{
  content:attr(data-ph);color:var(--muted);opacity:.55;font-weight:400;
  pointer-events:none;
}

/* =========================================================
   ФОРМУЛЫ (KaTeX)
   ========================================================= */
.katex{

}
.katex-display{

.math-raw{

}

.rowbtns{

}
tr:hover .rowbtns,tr:focus-within .rowbtns{opacity:1;}
.mini{

}
.mini:hover{color:var(--accent-text);border-color:var(--accent);background:var(--card);transform:translateY(-1px);}

.cardfoot{

.saved{

<script>
/* =========================================================
   КАНСТАНТЫ
   ========================================================= */
const SCHOOL_YEAR = { start: 2026, end: 2027 };
const STORE_KEY   = 'ktp-math-bgd-v7';
const THEME_KEY   = 'ktp-math-theme-mode';
const COLOR_KEY   = 'ktp-math-theme-color';

const COLORS = [
  { id:'indigo', hex:'#6366f1', name:'Індыга' },
  { id:'ocean',  hex:'#0ea5e9', name:'Акіян' },
  { id:'violet', hex:'#8b5cf6', name:'Фіялет' },
  { id:'rose',   hex:'#f43f5e', name:'Ружа' },
  { id:'amber',  hex:'#f59e0b', name:'Бурштын' },
  { id:'teal',   hex:'#14b8a6', name:'Біруза' },
  { id:'slate',  hex:'#64748b', name:'Шэры' },
];

const ALG = { id:'alg', name:'Алгебра',   short:'Алг.' };
const GEO = { id:'geo', name:'Геаметрыя', short:'Геам.' };

const CLASSES = [
  { id:'5',  name:'5 клас',        sub:'5 г/тыдзень · 175 г' },
  { id:'6',  name:'6 клас',        sub:'5 г/тыдзень · 175 г' },
  { id:'7',  name:'7 клас',        sub:'5 г/тыдзень · 175 г',
    components:[
      { ...ALG, sub:'3 г/тыдзень · 105 г' },
      { ...GEO, sub:'2 г/тыдзень · 70 г'  },
    ]},
  { id:'8',  name:'8 клас',        sub:'5 г/тыдзень · 175 г',
    components:[
      { ...ALG, sub:'3 г/тыдзень · 105 г' },
      { ...GEO, sub:'2 г/тыдзень · 70 г'  },
    ]},
  { id:'9',  name:'9 клас',        sub:'5 г/тыдзень · 152 г',
    components:[
      { ...ALG, sub:'91 г' },
      { ...GEO, sub:'61 г' },
    ]},
  { id:'9f', name:'Факультатыў 9', sub:'1 г/тыдзень · 35 г' },
  { id:'9h', name:'Надомнае 9',    sub:'3,5 г/тыдзень · 125 г' },
];

const MONTHS_NOM = ['студзень','люты','сакавік','красавік','май','чэрвень',
                    'ліпень','жнівень','верасень','кастрычнік','лістапад','снежань'];
const WEEKDAYS   = ['Пн','Аў','Ср','Ча','Пт','Сб','Нд'];

/* =========================================================
   УТЫЛІТЫ
   ========================================================= */
function uid(){ return Math.random().toString(36).slice(2, 9); }
function G(topic, hours, hw, dates){
  return { id: uid(), topic, hours, hw, dates: dates || [] };
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

/* =========================================================
   ФОРМУЛЫ (KaTeX)
   ========================================================= */
function katexReady(){ return typeof window.katex !== 'undefined'; }

/**
 * Рэндэрыць тэкст з падтрымкай формул:
 *   $...$   — інлайн
 *   $$...$$ — блочная
 * Усё астатняе экраніруецца.
 */
function renderMixed(text){
  if(text == null || text === '') return '';
  const src = String(text);

  // калі KaTeX не загрузіўся — паказваем проста тэкст
  if(!katexReady()){
    return esc(src);
  }

  let out = '';
  let i = 0;

  while(i < src.length){
    const dollar = src.indexOf('$', i);
    if(dollar < 0){
      out += esc(src.slice(i));
      break;
    }

    // вызначаем даўжыню адкрывальнага раздельніка
    const isBlock = src[dollar + 1] === '$';
    const openLen = isBlock ? 2 : 1;
    const closeTok = isBlock ? '$$' : '$';

    // шукаем закрыццё
    const close = src.indexOf(closeTok, dollar + openLen);
    if(close < 0){
      // няма закрыцця — проста выводзім як тэкст
      out += esc(src.slice(i, dollar + openLen));
      i = dollar + openLen;
      continue;
    }

    // тэкст перад формулай
    out += esc(src.slice(i, dollar));

    // сама формула
    const formula = src.slice(dollar + openLen, close);
    if(!formula.trim()){
      // пустая формула — выводзім як тэкст
      out += esc(src.slice(dollar, close + openLen));
    } else {
      try{
        out += katex.renderToString(formula, {
          throwOnError: false,
          displayMode: isBlock,
          strict: 'ignore',
          trust: false,
        });
      }catch(e){
        out += esc(src.slice(dollar, close + openLen));
      }
    }
    i = close + openLen;
  }

  return out;
}

/* =========================================================

   ========================================================= */
function load(){
  try{
    let d = null;
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      d = JSON.parse(raw);
    } else {
      const old = localStorage.getItem('ktp-math-bgd-v6')
              || localStorage.getItem('ktp-math-bgd-v5')
              || localStorage.getItem('ktp-math-bgd-v4')
              || localStorage.getItem('ktp-math-bgd-v3')
              || localStorage.getItem('ktp-math-bgd-v2');
      if(old){ try { d = JSON.parse(old); } catch(e){ d = null; } }
    }
    if(!d || typeof d !== 'object') return null;
    const migration = { '7':'alg', '8':'alg', '9':'alg' };
    for(const k in migration){
      if(Array.isArray(d[k])){
        const nk = k + '/' + migration[k];
        if(!d[nk]) d[nk] = d[k];
        delete d[k];
      }
    }
    for(const k in d){
      if(!Array.isArray(d[k])) return null;
      for(const g of d[k]){
        if(typeof g !== 'object' || !('topic' in g) || !('dates' in g)) return null;
      }
    }
    return d;
  }catch(e){ return null; }
}

let saveTimer = null;
function save(instant){
  clearTimeout(saveTimer);
  const doIt = () => {
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state.data));
      flashSaved();
    }catch(e){ console.warn('Не ўдалося захаваць', e); }
  };
  instant ? doIt() : (saveTimer = setTimeout(doIt, 400));
}
function flashSaved(){
  const m = document.getElementById('savedMsg');
  m.classList.add('show');
  clearTimeout(m._t);
  m._t = setTimeout(() => m.classList.remove('show'), 1200);
}

/* =========================================================
   ДАТЫ
   ========================================================= */
function parseDate(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})[.\/\-](\d{1,2})(?:[.\/\-](\d{2,4}))?$/);
  if(!m) return null;
  const d = +m[1], mo = +m[2];
  let y = m[3] ? +m[3] : null;
  if(y !== null && y < 100) y += 2000;
  if(y === null) y = (mo >= 9) ? SCHOOL_YEAR.start : SCHOOL_YEAR.end;
  if(d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  const dt = new Date(y, mo - 1, d);
  dt.setHours(0,0,0,0);
  return isNaN(dt.getTime()) ? null : dt;
}
function todayMidnight(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function fmt(dt){
  const p = n => String(n).padStart(2,'0');
  return `${p(dt.getDate())}.${p(dt.getMonth()+1)}.${dt.getFullYear()}`;
}
function fmtShort(d, m){ 
  return `${String(d).padStart(2,'0')}.${String(m+1).padStart(2,'0')}`;
}

function currentKey(){
  return state.currentComponent
    ? state.current + '/' + state.currentComponent
    : state.current;
}
function getCurrentData(){
  const k = currentKey();
  if(!Array.isArray(state.data[k])) state.data[k] = [];
  return state.data[k];
}
function getCurrentClass(){
  return CLASSES.find(c => c.id === state.current);
}
function getCurrentComponent(){
  const cls = getCurrentClass();
  if(!cls || !cls.components) return null;
  return cls.components.find(c => c.id === state.currentComponent) || null;
}

const modalBack = document.getElementById('modalBack');
const modalTitle = document.getElementById('modalTitle');
const modalText  = document.getElementById('modalText');
const modalYes   = document.getElementById('modalYes');
const modalNo    = document.getElementById('modalNo');
let modalResolve = null;

function confirmDialog(title, text, yesLabel, danger){
  return new Promise(resolve => {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalYes.textContent = yesLabel || 'Так';
    modalYes.className = danger ? 'warn' : 'primary';
    modalResolve = resolve;
    modalBack.classList.add('show');
  });
}
function closeModal(val){
  modalBack.classList.remove('show');
  if(modalResolve){ modalResolve(val); modalResolve = null; }
}
modalYes.onclick = () => closeModal(true);
modalNo.onclick  = () => closeModal(false);
modalBack.onclick = e => { if(e.target === modalBack) closeModal(false); };

   ========================================================= */
function expandRows(){
  const out = [];
  const groups = getCurrentData();
  groups.forEach((g, gi) => {
    const h = Math.max(1, Math.min(40, parseInt(g.hours) || 1));
    for(let i = 0; i < h; i++){
      out.push({
        group: g,
        groupIndex: gi,
        lessonIdx: i,
        isFirst: i === 0,
        totalInGroup: h,
        date: (g.dates && g.dates[i]) || '',
      });
    }
  });
  return out;
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  CLASSES.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tab' + (c.id === state.current ? ' active' : '');
    b.innerHTML = `${esc(c.name)}<small>${esc(c.sub)}</small>`;
    b.onclick = () => switchClass(c.id);
    el.appendChild(b);
  });
}
async function switchClass(classId){
  if(classId === state.current && !state.editing) return;
  if(state.editing){
    const ok = await confirmDialog(
      'Пераключыць клас?',
      'Вы ў рэжыме рэдагавання. Незахаваныя змены будуць страчаны. Працягнуць?',
      'Пераключыць', true
    );
    if(!ok) return;
    state.editing = false;
    state.snapshot = null;
  }
  state.current = classId;
  const cls = CLASSES.find(c => c.id === classId);
  state.currentComponent = (cls.components && cls.components.length)
    ? cls.components[0].id : null;
  renderAll();
}

function renderSubtabs(){
  const wrap = document.getElementById('subtabsWrap');
  const el   = document.getElementById('subtabs');
  const cls  = getCurrentClass();
  if(!cls || !cls.components || cls.components.length === 0){
    wrap.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  wrap.classList.add('show');
  el.innerHTML = '';
  cls.components.forEach(comp => {
    const b = document.createElement('button');
    b.className = 'subtab' + (comp.id === state.currentComponent ? ' active' : '');
    b.innerHTML = `${esc(comp.name)}<small>${esc(comp.sub || '')}</small>`;
    b.onclick = () => switchComponent(comp.id);
    el.appendChild(b);
  });
}
async function switchComponent(compId){
  if(compId === state.currentComponent) return;
  if(state.editing){
    const ok = await confirmDialog(
      'Пераключыць кампанент?',
      'Вы ў рэжыме рэдагавання. Незахаваныя змены будуць страчаны. Працягнуць?',
      'Пераключыць', true
    );
    if(!ok) return;
    state.editing = false;
    state.snapshot = null;
  }
  state.currentComponent = compId;
  renderAll();
}

   ========================================================= */
const tbody = document.getElementById('tbody');

function renderTable(){
  const cls  = getCurrentClass();
  const comp = getCurrentComponent();
  const rows = expandRows();

  const titleHTML = comp
    ? `МАТЭМАТЫКА · ${esc(cls.name)} <span class="comp-chip">${esc(comp.name)}</span>`
    : `МАТЭМАТЫКА · ${esc(cls.name)}`;
  document.getElementById('clsTitle').innerHTML = titleHTML;

  document.getElementById('clsSub').textContent = comp
    ? `${comp.sub || ''} · ${cls.sub}`
    : cls.sub;

  const t0 = todayMidnight();
  let todayRow = null, nextRow = null, nextDate = null;
  rows.forEach(r => {
    const d = parseDate(r.date);
    if(!d) return;
    const diff = Math.round((d - t0) / 86400000);
    if(diff === 0 && !todayRow) todayRow = r;
    if(diff > 0 && (nextDate === null || d < nextDate)){ nextDate = d; nextRow = r; }
  });

  tbody.innerHTML = '';

  if(rows.length === 0){
    const tr = document.createElement('tr');
    const emptyTitle = comp ? `Няма тэм у кампаненце «${esc(comp.name)}»` : 'Няма тэм';
    tr.innerHTML = `<td colspan="6" style="border:none">
      <div class="empty">
        <div class="empty-icon">📚</div>
        <h3>${emptyTitle}</h3>
        <p>${state.editing ? 'Націсніце «＋ Дадаць тэму», каб пачаць' : 'Уключыце рэжым рэдагавання, каб дадаць тэмы'}</p>
      </div>
    </td>`;
    tbody.appendChild(tr);
    updateNextInfo(todayRow, nextRow, nextDate);
    updateCounter(rows);
    applyEditMode();
    return;
  }

  rows.forEach((r, idx) => {
    const d = parseDate(r.date);
    const diff = d ? Math.round((d - t0) / 86400000) : null;

    let status = '';
    if(diff === 0) status = 'row-today';
    else if(r === nextRow) status = 'row-next';
    else if(diff !== null && diff < 0) status = 'row-past';

    const tr = document.createElement('tr');
    tr.dataset.group = r.group.id;
    tr.dataset.lesson = r.lessonIdx;
    tr.className = [status, r.isFirst ? 'group-start' : ''].filter(Boolean).join(' ');

    let badge = '';
    if(status === 'row-today') badge = '<span class="badge today">Сёння</span>';
    else if(status === 'row-next') badge = '<span class="badge next">Далей</span>';
    else if(status === 'row-past') badge = '<span class="badge past">✓ Прайшоў</span>';

    let hoursCell;
    if(r.isFirst){
      hoursCell = state.editing
        ? `<input class="hours-input" type="number" min="1" max="40" value="${r.totalInGroup}" data-field="hours">`
        : `<span class="hours-val">${r.totalInGroup}</span>`;
    } else {
      hoursCell = '';
    }

    const actCell = (r.isFirst && state.editing)
      ? `<div class="rowbtns">
           <button class="mini" data-act="up"   title="Уверх групы">↑</button>
           <button class="mini" data-act="down" title="Уніз групы">↓</button>
           <button class="mini del" data-act="del"  title="Выдаліць тэму">✕</button>
         </div>`
      : '';

    const dateText = r.date
      ? `<span class="date-edit" data-field="date" data-ph="00.00" contenteditable="false">${esc(r.date)}</span>`
      : `<span class="date-edit date-empty" data-field="date" data-ph="00.00" contenteditable="false">—</span>`;

    const calBtnHTML = state.editing
      ? `<button class="cal-btn" data-act="calendar" type="button" title="Выбраць дату з календара" aria-label="Каляндар">📅</button>`
      : '';

    // тэма і Д/З — з падтрымкай формул
    const topicHTML = state.editing
      ? esc(r.group.topic)
      : renderMixed(r.group.topic);
    const hwHTML = state.editing
      ? esc(r.group.hw)
      : renderMixed(r.group.hw);

    tr.innerHTML = `
      <td class="col-n" data-label="№">${idx + 1}</td>
      <td class="col-date" data-label="Дата">${dateText}${calBtnHTML}${badge}</td>
      <td class="col-topic" data-label="Тэма" data-field="topic" data-ph="Увядзіце тэму" contenteditable="false">${topicHTML}</td>
      <td class="col-h" data-label="Гадз.">${hoursCell}</td>
      <td class="col-hw" data-label="Д/З" data-field="hw" data-ph="—" contenteditable="false">${hwHTML}</td>
      <td class="col-act">${actCell}</td>`;

    tbody.appendChild(tr);
  });

  updateNextInfo(todayRow, nextRow, nextDate);
  updateCounter(rows);
  applyEditMode();
}

function updateNextInfo(todayRow, nextRow, nextDate){
  const info = document.getElementById('nextInfo');
  info.classList.remove('no-pulse');
  const topicToday = todayRow ? (todayRow.group.topic || 'урок') : '';
  const topicNext  = nextRow  ? (nextRow.group.topic  || '—')   : '';
  if(todayRow){
    info.innerHTML = `<span>● <b>Сёння</b> — ${renderMixed(topicToday)}</span>`;
    info.style.background = 'var(--today-soft)';
    info.style.color = 'var(--today)';
    info.style.borderColor = 'color-mix(in srgb, var(--today) 30%, transparent)';
  } else if(nextRow){
    info.innerHTML = `<span>◷ <b>Наступны ўрок:</b> ${fmt(nextDate)} — ${renderMixed(topicNext)}</span>`;
    info.style.background = 'var(--next-soft)';
    info.style.color = 'var(--next)';
    info.style.borderColor = 'color-mix(in srgb, var(--next) 30%, transparent)';
  } else {
    info.innerHTML = `<span>Няма дат у будучыні</span>`;
    info.style.background = 'var(--accent-soft)';
    info.style.color = 'var(--accent-text)';
    info.style.borderColor = 'color-mix(in srgb, var(--accent) 20%, transparent)';
    info.classList.add('no-pulse');
  }
}

function updateCounter(rows){
  const arr = getCurrentData();
  const hours = arr.reduce((s, g) => s + (parseInt(g.hours) || 0), 0);
  document.getElementById('counter').textContent =
    `${arr.length} тэм · ${hours} гадзін · ${rows.length} радкоў`;
}

/* =========================================================
   РЭЖЫМ
   ========================================================= */
function applyEditMode(){
  const table = document.getElementById('ktpTable');
  table.classList.toggle('editing', state.editing);

  document.getElementById('mainCard').classList.toggle('editing', state.editing);
  document.getElementById('editbar').classList.toggle('show', state.editing);
  document.getElementById('addRow').style.display = state.editing ? 'inline-flex' : 'none';

  table.querySelectorAll('[data-field]').forEach(el => {
    if(el.tagName === 'INPUT') return;
    el.setAttribute('contenteditable', state.editing ? 'true' : 'false');
  });

  const btn = document.getElementById('editBtn');
  if(state.editing){
    btn.style.display = 'none';
  } else {
    btn.style.display = 'inline-flex';
    btn.innerHTML = '✎<span> Рэдагаваць</span>';
    btn.className = 'primary';
  }
}

/* =========================================================
   УВАХОД / ВЫХАД
   ========================================================= */
function enterEditMode(){
  state.snapshot = clone(state.data);
  state.editing = true;
  renderTable();
}
function saveAndExit(){
  closeCalendar();
  state.editing = false;
  state.snapshot = null;
  save(true);
  renderTable();
}
async function cancelAndExit(){
  closeCalendar();
  if(!state.snapshot){ state.editing = false; renderTable(); return; }
  const ok = await confirmDialog(
    'Адмяніць змены?',
    'Усе змены, зробленыя ў рэжыме рэдагавання, будуць страчаны. Працягнуць?',
    'Адмяніць змены', true
  );
  if(ok){
    state.data = state.snapshot;
    state.snapshot = null;
    state.editing = false;
    save(true);
    renderTable();
  }
}

document.getElementById('editBtn').onclick = enterEditMode;
document.getElementById('saveBtn').onclick = saveAndExit;
document.getElementById('cancelBtn').onclick = cancelAndExit;

function findGroup(id){

function syncGroupField(groupId, field, value, sourceEl){
  const cells = tbody.querySelectorAll(`tr[data-group="${groupId}"] [data-field="${field}"]`);
  cells.forEach(el => {
    if(el !== sourceEl && el.textContent !== value) el.textContent = value;
  });
}

tbody.addEventListener('input', e => {
  if(!state.editing) return;
  const el = e.target.closest('[data-field]');
  if(!el || el.tagName === 'INPUT') return;

  const tr = el.closest('tr');
  const group = findGroup(tr.dataset.group);
  if(!group) return;

  const field = el.dataset.field;
  const val = el.textContent;

  if(field === 'topic'){
    group.topic = val;
    syncGroupField(group.id, 'topic', val, el);
    save();
  } else if(field === 'hw'){
    group.hw = val;
    syncGroupField(group.id, 'hw', val, el);
    save();
  } else if(field === 'date'){
    const lessonIdx = +tr.dataset.lesson;
    if(!group.dates) group.dates = [];
    group.dates[lessonIdx] = val;
    save();
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      const active = document.activeElement;
      if(active && active.dataset && active.dataset.field === 'date') return;
      renderTable();
    }, 1500);
  }
});

tbody.addEventListener('blur', e => {
  const el = e.target.closest && e.target.closest('[data-field="date"]');
  if(!el) return;
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    const active = document.activeElement;
    if(active && active.dataset && active.dataset.field === 'date') return;
    renderTable();
  }, 120);
}, true);

tbody.addEventListener('change', e => {
  if(!state.editing) return;
  const inp = e.target.closest('input[data-field="hours"]');
  if(!inp) return;
  const tr = inp.closest('tr');
  const group = findGroup(tr.dataset.group);
  if(!group) return;

  let n = parseInt(inp.value, 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > 40) n = 40;
  if(n === group.hours){ inp.value = n; return; }

  if(n < group.hours){
    confirmDialog(
      'Паменшыць колькасць гадзін?',
      `Колькасць гадзін зменшыцца з ${group.hours} да ${n}. Даты апошніх ${group.hours - n} урокаў будуць выдалены.`,
      'Паменшыць', true
    ).then(ok => {
      if(ok){
        group.hours = n;
        if(Array.isArray(group.dates)) group.dates = group.dates.slice(0, n);
        save(true);
      }
      renderTable();
    });
  } else {
    group.hours = n;
    if(!Array.isArray(group.dates)) group.dates = [];
    while(group.dates.length < n) group.dates.push('');
    save(true);
    renderTable();
  }
});

tbody.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && e.target.isContentEditable){
    e.preventDefault();
    e.target.blur();
  }
});

tbody.addEventListener('click', async e => {
  if(!state.editing) return;
  const tr = e.target.closest('tr');
  if(!tr) return;
  const group = findGroup(tr.dataset.group);
  if(!group) return;

  const calBtn = e.target.closest('[data-act="calendar"]');
  if(calBtn){
    e.preventDefault(); e.stopPropagation();
    const lessonIdx = +tr.dataset.lesson;
    const currentVal = (group.dates && group.dates[lessonIdx]) || '';
    openCalendar(calBtn, currentVal, (newVal) => {
      if(!group.dates) group.dates = [];
      group.dates[lessonIdx] = newVal;
      save();
      const span = tr.querySelector('[data-field="date"]');
      if(span){
        span.textContent = newVal || '—';
        span.classList.toggle('date-empty', !newVal);
      }
      setTimeout(() => { if(state.editing) renderTable(); }, 180);
    });
    return;
  }

  const actBtn = e.target.closest('[data-act]');
  if(actBtn){
    const id = tr.dataset.group;
    const arr = getCurrentData();
    const i = arr.findIndex(g => g.id === id);
    if(i < 0) return;
    const act = actBtn.dataset.act;
    if(act === 'up' && i > 0){
      [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
      save(true); renderTable();
    } else if(act === 'down' && i < arr.length - 1){
      [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
      save(true); renderTable();
    } else if(act === 'del'){
      const comp = getCurrentComponent();
      const ctx = comp ? ` (${comp.name})` : '';
      const ok = await confirmDialog(
        'Выдаліць тэму?',
        `Тэма «${arr[i].topic || 'без назвы'}»${ctx} разам з ${arr[i].hours} гадзінамі і датамі будзе выдалена.`,
        'Выдаліць', true
      );
      if(ok){
        arr.splice(i, 1);
        save(true); renderTable();
      }
    }
  }
});

tbody.addEventListener('dblclick', e => {
  if(!state.editing) return;
  const el = e.target.closest('[data-field="date"]');
  if(!el) return;
  const tr = el.closest('tr');
  const group = findGroup(tr.dataset.group);
  if(!group) return;
  const lessonIdx = +tr.dataset.lesson;
  const currentVal = (group.dates && group.dates[lessonIdx]) || '';
  openCalendar(el, currentVal, (newVal) => {
    if(!group.dates) group.dates = [];
    group.dates[lessonIdx] = newVal;
    save();
    const span = tr.querySelector('[data-field="date"]');
    if(span){
      span.textContent = newVal || '—';
      span.classList.toggle('date-empty', !newVal);
    }
    setTimeout(() => { if(state.editing) renderTable(); }, 180);
  });
});

/* =========================================================
   КАЛЯНДАР
   ========================================================= */
const calPopup    = document.getElementById('calPopup');
const calBackdrop = document.getElementById('calBackdrop');
let calState = { anchor: null, year: 0, month: 0, onPick: null };

function isMobileCal(){ return window.innerWidth <= 520; }

function openCalendar(anchorEl, initialValue, onPick){
  calState.anchor = anchorEl;
  calState.onPick = onPick;
  const dt = parseDate(initialValue) || new Date();
  calState.year  = dt.getFullYear();
  calState.month = dt.getMonth();
  renderCalendar(initialValue);
  positionCalendar();
  calPopup.classList.add('show');
  calBackdrop.classList.add('show');
}

function closeCalendar(){
  calPopup.classList.remove('show');
  calBackdrop.classList.remove('show');
  calState.anchor = null;
  calState.onPick = null;
}

function positionCalendar(){
  const anchor = calState.anchor;
  if(!anchor) return;
  const rect = anchor.getBoundingClientRect();
  const popupW = calPopup.offsetWidth || 308;
  const popupH = calPopup.offsetHeight || 380;
  const margin = 10;

  if(isMobileCal()){
    calPopup.style.top = '';
    calPopup.style.left = '';
    return;
  }

  let left = rect.left + rect.width / 2 - popupW / 2;
  if(left < margin) left = margin;
  if(left + popupW > window.innerWidth - margin){
    left = window.innerWidth - popupW - margin;
  }
  let top = rect.bottom + 8;
  if(top + popupH > window.innerHeight - margin){
    top = rect.top - popupH - 8;
  }
  if(top < margin) top = margin;

  calPopup.style.top = top + 'px';
  calPopup.style.left = left + 'px';
}

function renderCalendar(selectedValue){
  const sel = parseDate(selectedValue);
  const first = new Date(calState.year, calState.month, 1);
  let firstDay = first.getDay() - 1;
  if(firstDay < 0) firstDay = 6;

  const daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
  const daysInPrev  = new Date(calState.year, calState.month, 0).getDate();

  const today = new Date();
  today.setHours(0,0,0,0);

  let daysHTML = '';
  for(let i = firstDay - 1; i >= 0; i--){
    const d = daysInPrev - i;
    daysHTML += `<button type="button" class="cal-day other" data-d="${d}" data-m="-1">${d}</button>`;
  }
  for(let d = 1; d <= daysInMonth; d++){
    const dt = new Date(calState.year, calState.month, d);
    dt.setHours(0,0,0,0);
    const dow = dt.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const isToday = dt.getTime() === today.getTime();
    const isSel = sel && dt.getFullYear() === sel.getFullYear()
                && dt.getMonth() === sel.getMonth()
                && dt.getDate() === sel.getDate();
    const cls = ['cal-day'];
    if(isToday) cls.push('today');
    if(isSel)   cls.push('selected');
    if(isWeekend && !isSel) cls.push('weekend');
    daysHTML += `<button type="button" class="${cls.join(' ')}" data-d="${d}" data-m="0">${d}</button>`;
  }
  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  const remaining = totalCells - firstDay - daysInMonth;
  for(let d = 1; d <= remaining; d++){
    daysHTML += `<button type="button" class="cal-day other" data-d="${d}" data-m="1">${d}</button>`;
  }

  calPopup.innerHTML = `
    <div class="cal-head">
      <button type="button" class="cal-nav" data-nav="-1" aria-label="Папярэдні месяц">‹</button>
      <div class="cal-title">
        ${MONTHS_NOM[calState.month]}
        <small>${calState.year}</small>
      </div>
      <button type="button" class="cal-nav" data-nav="1" aria-label="Наступны месяц">›</button>
    </div>
    <div class="cal-weekdays">
      ${WEEKDAYS.map((w, i) => `<span class="${(i >= 5) ? 'weekend' : ''}">${w}</span>`).join('')}
    </div>
    <div class="cal-days">${daysHTML}</div>
    <div class="cal-foot">
      <button type="button" class="ghost" data-action="today">Сёння</button>
      <button type="button" class="ghost" data-action="clear">Ачысціць</button>
    </div>
  `;

  calPopup.querySelectorAll('.cal-nav').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const dir = parseInt(b.dataset.nav, 10);
      calState.month += dir;
      if(calState.month < 0){ calState.month = 11; calState.year--; }
      if(calState.month > 11){ calState.month = 0; calState.year++; }
      renderCalendar(selectedValue);
      if(!isMobileCal()) positionCalendar();
    };
  });

  calPopup.querySelectorAll('.cal-day').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const offset = parseInt(b.dataset.m, 10);
      let y = calState.year, m = calState.month;
      if(offset === -1){ m--; if(m < 0){ m = 11; y--; } }
      if(offset === 1){ m++; if(m > 11){ m = 0; y++; } }
      const d = parseInt(b.dataset.d, 10);
      const value = fmtShort(d, m);
      const cb = calState.onPick;
      closeCalendar();
      if(cb) cb(value);
    };
  });

  calPopup.querySelector('[data-action="today"]').onclick = (e) => {
    e.stopPropagation();
    const t = new Date();
    const value = fmtShort(t.getDate(), t.getMonth());
    const cb = calState.onPick;
    closeCalendar();
    if(cb) cb(value);
  };

  calPopup.querySelector('[data-action="clear"]').onclick = (e) => {
    e.stopPropagation();
    const cb = calState.onPick;
    closeCalendar();
    if(cb) cb('');
  };
}

calBackdrop.onclick = () => closeCalendar();
document.addEventListener('click', e => {
  if(!calPopup.classList.contains('show')) return;
  if(calPopup.contains(e.target)) return;
  if(e.target.closest('[data-act="calendar"]')) return;
  if(e.target.closest('[data-field="date"]')) return;
  closeCalendar();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(calPopup.classList.contains('show')) closeCalendar();
    else if(modalBack.classList.contains('show')) closeModal(false);
  }
});
window.addEventListener('resize', () => {
  if(calPopup.classList.contains('show')) positionCalendar();
});
window.addEventListener('scroll', () => {
  if(calPopup.classList.contains('show') && !isMobileCal()) positionCalendar();
}, true);

document.getElementById('addRow').onclick = () => {

  const arr = getCurrentData();

  save(true);
  renderTable();
  setTimeout(() => {
    const rows = tbody.querySelectorAll('tr');

/* =========================================================
   ЭКСПАРТ / ІМПАРТ
   ========================================================= */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'КТП_Матэматыка_2026-2027.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

document.getElementById('importBtn').onclick = async () => {
  if(state.editing){
    const ok = await confirmDialog(
      'Імпарт падчас рэдагавання',
      'Вы ў рэжыме рэдагавання. Імпарт заменіць усе дадзеныя. Працягнуць?',
      'Імпартаваць', true
    );
    if(!ok) return;
  }
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(typeof d !== 'object' || d === null) throw new Error('няправільны фармат');
      state.data = d;
      state.editing = false;
      state.snapshot = null;
      const cls = CLASSES.find(c => c.id === state.current);
      if(cls.components && cls.components.length){
        state.currentComponent = cls.components[0].id;
      }
      save(true);
      renderAll();
      setTimeout(() => flashSaved(), 200);
    }catch(err){
      alert('Не ўдалося прачытаць файл: ' + err.message);
    }
  };
  reader.readAsText(f);
  e.target.value = '';
};

/* =========================================================
   ТЭМА
   ========================================================= */
function getThemeMode(){ return localStorage.getItem(THEME_KEY) || 'auto'; }
function setThemeMode(m){ localStorage.setItem(THEME_KEY, m); applyThemeMode(); }
function getThemeColor(){ return localStorage.getItem(COLOR_KEY) || 'indigo'; }
function setThemeColor(c){ localStorage.setItem(COLOR_KEY, c); applyThemeColor(); }

function applyThemeMode(){
  const mode = getThemeMode();
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const resolved = mode === 'auto' ? (sysDark ? 'dark' : 'light') : mode;
  document.documentElement.dataset.theme = resolved;
  document.querySelectorAll('.mode-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
}
function applyThemeColor(){
  const color = getThemeColor();
  document.documentElement.dataset.color = color;
  document.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === color);
  });
}

(function buildSwatches(){
  const wrap = document.getElementById('colorSwatches');
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.color = c.id;
    b.style.setProperty('--sw', c.hex);
    b.title = c.name;
    b.setAttribute('aria-label', c.name);
    b.onclick = () => setThemeColor(c.id);
    wrap.appendChild(b);
  });
})();

document.querySelectorAll('.mode-btns button').forEach(b => {
  b.onclick = () => setThemeMode(b.dataset.mode);
});

const themePanel = document.getElementById('themePanel');
const themeBtn   = document.getElementById('themeBtn');
themeBtn.onclick = e => {
  e.stopPropagation();
  themePanel.classList.toggle('show');
};
document.addEventListener('click', e => {
  if(!themePanel.classList.contains('show')) return;
  if(themePanel.contains(e.target)) return;
  if(themeBtn.contains(e.target)) return;
  themePanel.classList.remove('show');
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(getThemeMode() === 'auto') applyThemeMode();
});

/* =========================================================
   КАМПАКТНАЯ ШАПКА ПРЫ СКРОЛЕ (мабільны)
   ========================================================= */
const topbarEl = document.getElementById('topbar');
let scrollTicking = false;

function handleScroll(){
  const isMobile = window.innerWidth <= 760;
  if(!isMobile){
    topbarEl.classList.remove('compact');
    return;
  }
  if(window.scrollY > 30){
    topbarEl.classList.add('compact');
  } else {
    topbarEl.classList.remove('compact');
  }
}

window.addEventListener('scroll', () => {
  if(!scrollTicking){
    scrollTicking = true;
    requestAnimationFrame(() => {
      handleScroll();
      scrollTicking = false;
    });
  }
}, { passive:true });

window.addEventListener('resize', handleScroll);

/* =========================================================
   СТАРТ
   ========================================================= */
function renderAll(){
  renderTabs();
  renderSubtabs();
  renderTable();
}

(function initCurrentComponent(){
  const cls = CLASSES.find(c => c.id === state.current);
  if(cls.components && cls.components.length){
    state.currentComponent = cls.components[0].id;
  }
})();

applyThemeMode();
applyThemeColor();
handleScroll();
renderAll();

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && !state.editing) renderTable();
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    if(state.editing) saveAndExit();
    else save(true);
  }
});

/* калі KaTeX пагрузіўся пасля першага рэндэра — перамалёўваем */
window.addEventListener('load', () => {
  if(!state.editing) renderTable();
});
